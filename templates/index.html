<!DOCTYPE html>
<html>
<head>

<title>Chronic Kidney Disease Prediction</title>

<style>

body{
font-family: Arial;
margin:0;
padding:0;
background:url("https://images.unsplash.com/photo-1581595219315-a187dd40c322") no-repeat center center/cover;
}

.overlay{
background:rgba(0,0,0,0.65);
min-height:100vh;
padding:40px;
}

.container{
width:550px;
margin:auto;
background:white;
padding:30px;
border-radius:10px;
box-shadow:0px 0px 15px rgba(0,0,0,0.4);
}

h1{
text-align:center;
color:#2c3e50;
}

.section{
margin-top:25px;
}

.section h3{
background:#3498db;
color:white;
padding:8px;
border-radius:5px;
}

label{
font-weight:bold;
margin-top:10px;
display:block;
}

input{
width:100%;
padding:8px;
margin-top:5px;
border-radius:5px;
border:1px solid #ccc;
}

button{
width:100%;
padding:12px;
background:#27ae60;
color:white;
border:none;
border-radius:5px;
font-size:16px;
margin-top:20px;
cursor:pointer;
}

button:hover{
background:#1e8449;
}

.result{
margin-top:20px;
padding:10px;
text-align:center;
font-size:20px;
font-weight:bold;
color:#e74c3c;
}

.team-title{
text-align:center;
margin-top:40px;
}

.team{
display:flex;
justify-content:center;
gap:40px;
margin-top:20px;
}

.member{
text-align:center;
}

.member img{
width:90px;
height:90px;
border-radius:50%;
border:3px solid #3498db;
object-fit:cover;
}

.member p{
margin-top:8px;
font-weight:bold;
}

</style>

</head>

<body>

<div class="overlay">

<div class="container">

<h1>Chronic Kidney Disease Prediction</h1>

<form action="/predict" method="post">

<div class="section">

<h3>Patient Information</h3>

<label>Age</label>
<input type="number" name="age">

<label>Blood Pressure</label>
<input type="number" name="bp">

<label>Specific Gravity</label>
<input type="number" step="0.01" name="sg">

<label>Albumin</label>
<input type="number" name="al">

<label>Sugar</label>
<input type="number" name="su">

</div>

<div class="section">

<h3>Blood Test</h3>

<label>Blood Glucose Random</label>
<input type="number" name="bgr">

<label>Blood Urea</label>
<input type="number" name="bu">

<label>Serum Creatinine</label>
<input type="number" step="0.1" name="sc">

<label>Sodium</label>
<input type="number" name="sod">

<label>Potassium</label>
<input type="number" step="0.1" name="pot">

<label>Hemoglobin</label>
<input type="number" step="0.1" name="hemo">

<label>Packed Cell Volume</label>
<input type="number" name="pcv">

<label>White Blood Cell Count</label>
<input type="number" name="wc">

<label>Red Blood Cell Count</label>
<input type="number" step="0.1" name="rc">

</div>

<div class="section">

<h3>Urine Test</h3>

<label>Red Blood Cells (0=Normal,1=Abnormal)</label>
<input type="number" name="rbc">

<label>Pus Cell (0=Normal,1=Abnormal)</label>
<input type="number" name="pc">

<label>Pus Cell Clumps (0=No,1=Yes)</label>
<input type="number" name="pcc">

<label>Bacteria (0=No,1=Yes)</label>
<input type="number" name="ba">

</div>

<div class="section">

<h3>Medical Conditions</h3>

<label>Hypertension (0=No,1=Yes)</label>
<input type="number" name="htn">

<label>Diabetes Mellitus (0=No,1=Yes)</label>
<input type="number" name="dm">

<label>Coronary Artery Disease (0=No,1=Yes)</label>
<input type="number" name="cad">

<label>Appetite (0=Good,1=Poor)</label>
<input type="number" name="appet">

<label>Pedal Edema (0=No,1=Yes)</label>
<input type="number" name="pe">

<label>Anemia (0=No,1=Yes)</label>
<input type="number" name="ane">

</div>

<button type="submit">Predict Kidney Disease</button>

</form>

{% if prediction %}
<div class="result">
Prediction Result : {{prediction}}
</div>
{% endif %}

<h3 class="team-title">Designed and Developed By</h3>

<div class="team">

<div class="member">
<img src="{{ url_for('static', filename='Himaja.jpeg') }}">
<p>Himaja A</p>
</div>

<div class="member">
<img src="{{ url_for('static', filename='Vedasri.jpeg') }}">
<p>Vedasri S</p>
</div>

<div class="member">
<img src="{{ url_for('static', filename='Saniya.jpeg') }}">
<p>Saniya Akumath</p>
</div>



</div>

</div>
</div>

</body>
</html>
